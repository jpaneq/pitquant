[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pitquant"
version = "0.1.0"
description = "Point-in-time equity analysis, scoring and backtesting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "exchange_calendars>=4.5",
    "fastapi>=0.110",
    "structlog>=24.1",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
]

[project.scripts]
pitquant = "pitquant.cli:main"

[project.optional-dependencies]
research-data = ["httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
orchestration = ["prefect>=3.0"]
localpg = ["pgserver>=0.1"]
ml = ["scikit-learn>=1.4", "xgboost==3.1.3", "mlflow>=2.12"]
equity-ranking = ["xgboost==3.1.3", "scikit-learn==1.7.2"]
equity-baseline = ["scikit-learn==1.7.2", "matplotlib==3.10.7"]
dev = ["scikit-learn==1.7.2", "xgboost==3.1.3", "pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "mypy>=1.10", "ruff>=0.5", "uvicorn>=0.29", "reportlab>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "pit: point-in-time / anti-leakage tests (must never be skipped)",
    "postgres: requires a live PostgreSQL (CI service)",
    "realdata: needs a real source document archived locally under data/ (skipped if absent)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pitquant"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pitquant.jobs.flows"
disallow_untyped_decorators = false
