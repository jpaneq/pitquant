# PITQuant default configuration. Nothing critical is hardcoded in code.
# Changing anything under `validation.final_holdout` requires a new ADR (see D-09).

version: "2026.10.01-1"

database:
  url: "sqlite+pysqlite:///:memory:"   # overridden by PITQUANT_DATABASE_URL
  parquet_root: "data/parquet"

markets:
  XNYS:
    timezone: "America/New_York"
    currency: "USD"
    benchmark_tr: "SP500_TR"
  XMAD:
    timezone: "Europe/Madrid"
    currency: "EUR"
    benchmark_tr: "IBEX35_TR"

universes:
  - code: "SP500"
    calendar: "XNYS"
    expected_size: [495, 510]     # >500 rows allowed: multiple share classes
    canonical_source: "SPDJI_LICENSED"
  - code: "IBEX35"
    calendar: "XMAD"
    expected_size: [33, 36]       # BME history: 33 members 2006-07-25..31 (rows 55-58), 36 in 2012 (DIA)
    canonical_source: "BME_HISTORICAL_COMPOSITION"

archive:
  root: "data/archive"           # content-addressed raw source archive (SHA-256)

fundamentals:
  sec:
    user_agent: "PITQuant research (set PITQUANT_SEC_USER_AGENT)"   # SEC requires a contact
    max_requests_per_second: 8
    coverage_start: "2011-01-01"    # XBRL era; earlier backfill possible later
    availability_policy: "conservative_session"   # conservative_session | accepted_plus_lag
    lag_minutes: 15
    forms: ["10-K", "10-K/A", "10-Q", "10-Q/A", "20-F", "20-F/A", "40-F", "40-F/A"]

pit:
  # Lag added to records with an exact publication INSTANT. Date-only records ignore it:
  # they become available at the first open strictly after the end of that date (ADR-0018).
  default_publication_lag_minutes: 60
  label_data_lag_minutes: 60

horizons: ["6m", "12m"]

execution:
  mode: "next_open"          # next_open | next_close | next_vwap
  delay_sessions: 0

backtest:
  rebalance_frequency: "monthly"   # monthly | weekly | quarterly
  snapshot_rule: "first_session"
  overlapping: true

validation:
  mode: "expanding_walk_forward"
  train_min_months: 60
  validation_months: 24
  test_months: 12
  step_months: 12
  embargo_months: null        # null -> equal to the horizon
  final_holdout:
    start: "2022-10-01"
    end: "2025-09-30"

scoring:
  version: "baseline-0.1-hypothesis"
  weights:
    "6m":  {fundamental: 0.45, technical: 0.40, market_regime: 0.15}
    "12m": {fundamental: 0.60, technical: 0.25, market_regime: 0.15}
  thresholds:
    p_buy: 0.60
    p_sell: 0.40
    min_confidence: 0.50
  winsorize: [0.01, 0.99]

reporting:
  base_currency: "EUR"
  excess_return_currency: "local"

data_readiness:
  # Only the D-05 ADR may add providers here, after they pass tests/contracts/.
  accepted_market_data_sources: {US: [], ES: []}
  accepted_corporate_action_sources: []
  min_universe_coverage: 0.95

seed: 20261001
