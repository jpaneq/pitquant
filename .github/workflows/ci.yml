name: ci
on: [push, pull_request]

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests migrations scripts && ruff format --check src tests migrations scripts
      - name: Type check
        run: mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Point-in-time / anti-leakage suite (no skips allowed)
        shell: bash  # implies -eo pipefail: a pytest failure must not be masked by tee
        run: |
          pytest -m "pit and not postgres" -rs | tee pit.log
          ! grep -E "^SKIPPED" pit.log
      - name: Full suite on SQLite (postgres tests are covered by the dedicated job)
        run: pytest -m "not postgres"

  postgres:
    # Dedicated job with a REAL PostgreSQL. Strict mode makes the run fail if the URL is
    # not PostgreSQL, if zero postgres tests run, or if any of them is skipped.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: pit, POSTGRES_PASSWORD: pit, POSTGRES_DB: pit}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pit" --health-interval 5s --health-retries 10
    env:
      PITQUANT_PG_URL: postgresql+psycopg://pit:pit@localhost:5432/pit
      PITQUANT_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,postgres]"
      - name: Triggers, migrations, UTC round-trip (strict)
        run: pytest -m postgres -rA
      - name: Migration up/check/down
        run: |
          PITQUANT_DATABASE_URL=$PITQUANT_PG_URL alembic upgrade head
          PITQUANT_DATABASE_URL=$PITQUANT_PG_URL alembic check
          PITQUANT_DATABASE_URL=$PITQUANT_PG_URL alembic downgrade base

  docker:
    runs-on: ubuntu-latest
    needs: [lint-type, tests, postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pitquant:ci .
